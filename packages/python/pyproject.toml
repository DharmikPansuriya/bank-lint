[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-lint"
version = "0.0.1"
description = "Validate bank and account details — IBAN, UK sort codes, US routing numbers."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dharmik Pansuriya" }]
keywords = ["iban", "bank", "validation", "sort-code", "routing-number", "aba"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/bank_lint"]